name: Release linux/arm64 binary

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.25.x"
  NODE_VERSION: "22"
  BINARY_NAME: zorth-deploy-hub

jobs:
  build-arm64:
    name: Build linux/arm64 binary
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Build binary
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w" -o "../dist/${BINARY_NAME}" ./cmd/server
          file "../dist/${BINARY_NAME}"
          ls -lh "../dist/${BINARY_NAME}"

      - name: Package release
        run: |
          mkdir -p dist/package
          cp "dist/${BINARY_NAME}" dist/package/
          cp backend/.env.example dist/package/.env.example
          cp scripts/run-arm64.md dist/package/README.md
          tar -C dist/package -czf "dist/${BINARY_NAME}-linux-arm64.tar.gz" .
          ls -lh "dist/${BINARY_NAME}-linux-arm64.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-linux-arm64
          path: |
            dist/${{ env.BINARY_NAME }}-linux-arm64.tar.gz
            dist/${{ env.BINARY_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.BINARY_NAME }}-linux-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
